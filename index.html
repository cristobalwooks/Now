<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NOW">
  <meta name="theme-color" content="#0b0b0b">
  <meta charset="UTF-8" />
  <title>NOW</title>

<style>
body {
  background: linear-gradient(180deg,#111827 0%,#0e1624 40%,#0b0b0b 100%);
  min-height: 100vh;
  color: #eaeaea;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  text-align: center;
  padding: 40px;
  transition: opacity 1.5s ease;
}
body.fade-out { opacity: 0; }

.hidden { display: none; }
.box { margin-top: 28px; padding: 24px; }

/* INTRO */
#intro {
  position: fixed;
  inset: 0;
  background: #0b0b0b;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#intro h1 {
  font-size: 42px;
  letter-spacing: 4px;
  opacity: 0;
  transform: scale(.96);
  transition: opacity 1.1s ease, transform 1.1s ease;
}

/* INPUT */
.instruction {
  font-size: 14px;
  color: #ccc;
  margin-bottom: 6px;
}
textarea {
  width: 100%;
  max-width: 320px;
  height: 120px;
  margin: 0 auto;
  display: block;
  background: #111;
  color: #f2f2f2;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 14px;
  font-size: 15px;
}

/* BUTTONS */
button {
  margin: 10px 8px;
  padding: 14px 20px;
  font-size: 15px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: transform .08s ease, box-shadow .08s ease;
}

.red {
  background:#e53935;
  color:#fff;
  box-shadow:0 6px 14px rgba(229,57,53,.35);
}
.red:active { transform:translateY(1px); box-shadow:0 3px 8px rgba(229,57,53,.35); }

.green {
  background:#2ecc71;
  color:#081a0f;
  font-weight:600;
  box-shadow:0 6px 14px rgba(46,204,113,.35);
}
.green:active { transform:translateY(1px); box-shadow:0 3px 8px rgba(46,204,113,.35); }

.gray { background:#3a3a3a; color:#ddd; }

.rest {
  background:#1e3a5f;
  color:#e8f2ff;
  box-shadow:0 8px 18px rgba(30,58,95,.45);
}
.rest:active { transform:translateY(1px); box-shadow:0 4px 10px rgba(30,58,95,.45); }

/* TIME */
.time button { opacity:.4; }
.time button.active { opacity:1; border:2px solid #fff; }

/* TEXT */
.final { font-size:18px; line-height:1.4; }

/* DONE ANIMATION */
.fade-up {
  animation: fadeUp .45s ease-out forwards;
}
@keyframes fadeUp {
  from { opacity:1; transform:translateY(0); filter:blur(0); }
  to { opacity:0; transform:translateY(-20px); filter:blur(4px); }
}

/* SLEEP */
.zzz {
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:12px;
}
.zzz span {
  font-size:18px;
  color:#4fc3f7;
  opacity:.8;
  animation: wave 2.4s infinite ease-in-out;
}
.zzz span:nth-child(1){animation-delay:0s;}
.zzz span:nth-child(2){animation-delay:.2s;}
.zzz span:nth-child(3){animation-delay:.4s;}
.zzz span:nth-child(4){animation-delay:.6s;}
.zzz span:nth-child(5){animation-delay:.8s;}
.zzz span:nth-child(6){animation-delay:1s;}

@keyframes wave {
  0%{transform:translateY(0);opacity:.4;}
  50%{transform:translateY(-6px);opacity:1;}
  100%{transform:translateY(0);opacity:.4;}
}

.goodbye {
  margin-top:28px;
  font-size:13px;
  color:#777;
  opacity:0;
  animation: fadeIn 1.5s ease forwards;
  animation-delay:2.5s;
}
@keyframes fadeIn { to { opacity:1; } }

.done-mark { font-size:20px; margin-left:6px; }
</style>
</head>

<body>

<div id="intro"><h1>NOW</h1></div>

<div id="header"><h1>NOW</h1></div>

<div id="idleBox" class="box hidden">
  <div class="instruction">Jedna linia = jedno zadanie</div>
  <textarea id="chaosInput" placeholder="Wpisz chaos..."></textarea>

  <div class="time">
    <p>Ile masz czasu na START?</p>
    <button id="t5" onclick="setTime('5')">5 min</button>
    <button id="t15" onclick="setTime('15')">15 min</button>
    <button id="t30" onclick="setTime('30')">30+ min</button>
  </div>

  <button class="red" onclick="decide()">ZDECYDUJ ZA MNIE</button>
</div>

<div id="decidedBox" class="box hidden">
  <p id="decideText" class="final"></p>
  <p id="decidedTask"></p>
  <button class="green" onclick="startTask()">ZACZĄŁEM</button>
  <button class="gray" onclick="skipTask()">NIE TERAZ</button>
</div>

<div id="doingBox" class="box hidden">
  <h2>ROBISZ</h2>
  <p id="doingTask"></p>
  <button class="green" onclick="doneTask()">ZROBIONE <span class="done-mark">👍</span></button>
</div>

<div id="emptyBox" class="box hidden">
  <p>Chaos zniknął. Dobra robota.</p>
  <button class="rest" onclick="sleep()">Odpoczywam</button>
  <button class="red" onclick="reset()">Nowy chaos</button>
</div>

<div id="sleepBox" class="box hidden">
  <div class="zzz">
    <span>z</span><span>z</span><span>z</span><span>z</span><span>z</span><span>z</span>
  </div>
  <div class="goodbye">Wróć, gdy będziesz mnie potrzebować.</div>
</div>

<script>
/* INTRO LOGIC — ZAWSZE ZNIKA */
(() => {
  const intro = document.getElementById("intro");
  const h1 = intro.querySelector("h1");
  requestAnimationFrame(() => {
    h1.style.opacity = "1";
    h1.style.transform = "scale(1)";
  });
  setTimeout(() => intro.remove(), 1300);
})();

/* === NEW: POWRÓT Z BACKGROUNDU PO ZAKOŃCZENIU SESJI === */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && sessionStorage.getItem("sessionEnded") === "1") {
    sessionStorage.removeItem("sessionEnded");
    location.reload();
  }
});

const API = "https://now-production-9649.up.railway.app";

let selectedTime = null;
let hasDoneAnything = false;
let lastAutoDecided = false;

/* 🔊 TAP SOUND */
function playTap() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();

  const now = ctx.currentTime;
  const o = ctx.createOscillator();
  const g = ctx.createGain();

  o.frequency.value = 150;
  g.gain.setValueAtTime(0.12, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

  o.connect(g);
  g.connect(ctx.destination);

  o.start(now);
  o.stop(now + 0.08);
}

function hideAll(){
  document.querySelectorAll(".box").forEach(b=>b.classList.add("hidden"));
}

async function getState(){
  const res = await fetch(API + "/state");
  return res.json();
}

function setTime(t){
  selectedTime = t;
  ["t5","t15","t30"].forEach(id =>
    document.getElementById(id).classList.remove("active")
  );
  document.getElementById("t"+t).classList.add("active");
}

async function render(){
  const state = await getState();
  hideAll();

  if (state.status==="IDLE" && state.chaos.length===1 && !lastAutoDecided) {
    lastAutoDecided = true;
    await fetch(API+"/decide",{method:"POST"});
    return render();
  }

  if (state.status==="IDLE") {
    lastAutoDecided = false;
    if (state.chaos.length===0) {
      (hasDoneAnything?emptyBox:idleBox).classList.remove("hidden");
      return;
    }
    chaosInput.value = state.chaos.join("\n");
    idleBox.classList.remove("hidden");
    return;
  }

  if (state.status==="DECIDED") {
    decidedTask.innerText = state.currentTask;
    decideText.innerHTML =
      state.chaos.length===1
        ? "Zostało jedno zadanie.<br>To jest najlepszy ruch TERAZ."
        : "To jest najlepszy ruch TERAZ.";
    decidedBox.classList.remove("hidden");
    return;
  }

  if (state.status==="DOING") {
    doingTask.innerText = state.currentTask;
    doingBox.classList.remove("hidden");
  }
}

async function decide(){
  if (!selectedTime) return alert("Wybierz czas na START.");

  const state = await getState();
  if (state.chaos.length===0) {
    const tasks = chaosInput.value.split("\n").map(t=>t.trim()).filter(Boolean);
    if (!tasks.length) return;
    await fetch(API+"/tasks",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({tasks})
    });
  }
  await fetch(API+"/decide",{method:"POST"});
  render();
}

async function startTask(){
  await fetch(API+"/start",{method:"POST"});
  render();
}

async function doneTask(){
  playTap();
  doingTask.classList.add("fade-up");

  setTimeout(async()=>{
    await fetch(API+"/done",{method:"POST"});
    hasDoneAnything = true;
    selectedTime = null;
    doingTask.classList.remove("fade-up");
    render();
  },450);
}

async function skipTask(){
  const state = await getState();
  if (state.chaos.length===1) return sleep();
  await fetch(API+"/later",{method:"POST"});
  selectedTime = null;
  lastAutoDecided = false;
  render();
}

async function reset(){
  await fetch(API+"/tasks",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tasks:[]})
  });
  chaosInput.value="";
  hasDoneAnything=false;
  selectedTime=null;
  lastAutoDecided=false;
  render();
}

function sleep(){
  hideAll();
  sleepBox.classList.remove("hidden");

  /* === NEW: OZNACZENIE KOŃCA SESJI === */
  sessionStorage.setItem("sessionEnded","1");

  setTimeout(()=>document.body.classList.add("fade-out"),5000);
}

render();
</script>

</body>
</html>
