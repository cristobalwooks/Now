<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NOW">
  <meta name="theme-color" content="#0b0b0b">
  <meta charset="UTF-8" />
  <title>NOW</title>

<style>
body {
  background: #0b0b0b;
  color: #e6e6e6;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif;
  text-align: center;
  padding: 40px;
  transition: opacity 1.5s ease;
}

body.fade-out { opacity: 0; }

textarea {
  width: 100%;
  max-width: 320px;
  height: 120px;
  margin: 0 auto;
  display: block;
  background: #111;
  color: #f2f2f2;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 15px;
}

button {
  margin: 8px;
  padding: 12px 18px;
  font-size: 15px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.red { background: #e53935; color: white; }
.green { background: #2ecc71; color: black; }
.gray { background: #444; color: white; }

.box {
  margin-top: 28px;
  padding: 24px;
}

.hidden { display: none; }

.time button { opacity: 0.4; }
.time button.active {
  opacity: 1;
  border: 2px solid white;
}

.final {
  font-size: 18px;
  line-height: 1.4;
}

/* ✨ ZROBIONE */
.fade-up {
  animation: fadeUp 0.45s ease-out forwards;
}
@keyframes fadeUp {
  from { opacity: 1; transform: translateY(0); filter: blur(0); }
  to   { opacity: 0; transform: translateY(-20px); filter: blur(4px); }
}

/* 🌙 SLEEP – ZZZ SINUS */
.zzz {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
}

.zzz span {
  font-size: 18px;
  color: #4fc3f7;
  opacity: 0.8;
  animation: wave 2.4s infinite ease-in-out;
}

.zzz span:nth-child(1) { animation-delay: 0s; }
.zzz span:nth-child(2) { animation-delay: .2s; }
.zzz span:nth-child(3) { animation-delay: .4s; }
.zzz span:nth-child(4) { animation-delay: .6s; }
.zzz span:nth-child(5) { animation-delay: .8s; }
.zzz span:nth-child(6) { animation-delay: 1s; }

@keyframes wave {
  0%   { transform: translateY(0); opacity: .4; }
  50%  { transform: translateY(-6px); opacity: 1; }
  100% { transform: translateY(0); opacity: .4; }
}

.goodbye {
  margin-top: 28px;
  font-size: 13px;
  color: #777;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards;
  animation-delay: 2.5s;
}
@keyframes fadeIn { to { opacity: 1; } }

.done-mark {
  font-size: 22px;
  margin-left: 6px;
  opacity: 0.85;
}
</style>
</head>

<body>

<div id="header">
  <h1>NOW</h1>
</div>

<!-- IDLE -->
<div id="idleBox" class="box hidden">
  <textarea id="chaosInput" placeholder="Wpisz chaos..."></textarea>
  <p style="margin-top:8px;font-size:13px;color:#777;">
    Jedna linia = jedno zadanie
  </p>

  <div class="time">
    <p>Ile masz czasu na START?</p>
    <button id="t5" onclick="setTime('5')">5 min</button>
    <button id="t15" onclick="setTime('15')">15 min</button>
    <button id="t30" onclick="setTime('30')">30+ min</button>
  </div>

  <button class="red" onclick="decide()">ZDECYDUJ ZA MNIE</button>
</div>

<!-- DECIDED -->
<div id="decidedBox" class="box hidden">
  <p id="decideText" class="final"></p>
  <p id="decidedTask"></p>
  <button class="green" onclick="startTask()">ZACZĄŁEM</button>
  <button class="gray" onclick="skipTask()">NIE TERAZ</button>
</div>

<!-- DOING -->
<div id="doingBox" class="box hidden">
  <h2>ROBISZ</h2>
  <p id="doingTask"></p>
  <button class="green" onclick="doneTask()">
    ZROBIONE <span class="done-mark">👍</span>
  </button>
</div>

<!-- EMPTY -->
<div id="emptyBox" class="box hidden">
  <p>Chaos zniknął. Dobra robota.</p>
  <button class="gray" onclick="sleep()">Odpoczywam</button>
  <button class="red" onclick="reset()">Nowy chaos</button>
</div>

<!-- SLEEP -->
<div id="sleepBox" class="box hidden">
  <div class="zzz">
    <span>z</span><span>z</span><span>z</span><span>z</span><span>z</span><span>z</span>
  </div>
  <div class="goodbye">Wróć, gdy będziesz mnie potrzebować.</div>
</div>

<script>
const API = "https://now-production-9649.up.railway.app";

let selectedTime = null;
let hasDoneAnything = false;
let lastAutoDecided = false;

function playTap() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  const bufferSize = ctx.sampleRate * 0.12;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }

  const noise = ctx.createBufferSource();
  noise.buffer = buffer;

  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 700;

  const gain = ctx.createGain();
  gain.gain.value = 0.12;

  noise.connect(filter).connect(gain).connect(ctx.destination);
  noise.start();
}


function hideAll() {
  document.querySelectorAll(".box").forEach(b => b.classList.add("hidden"));
}

async function getState() {
  const res = await fetch(API + "/state");
  return res.json();
}

function setTime(t) {
  selectedTime = t;
  ["t5","t15","t30"].forEach(id =>
    document.getElementById(id).classList.remove("active")
  );
  document.getElementById("t"+t).classList.add("active");
}

async function render() {
  const state = await getState();
  hideAll();

  if (state.status === "IDLE" && state.chaos.length === 1 && !lastAutoDecided) {
    lastAutoDecided = true;
    await fetch(API + "/decide", { method: "POST" });
    return render();
  }

  if (state.status === "IDLE") {
    lastAutoDecided = false;
    if (state.chaos.length === 0) {
      (hasDoneAnything ? emptyBox : idleBox).classList.remove("hidden");
      return;
    }
    chaosInput.value = state.chaos.join("\n");
    idleBox.classList.remove("hidden");
    return;
  }

  if (state.status === "DECIDED") {
    decidedTask.innerText = state.currentTask;
    decideText.innerHTML =
      state.chaos.length === 1
        ? "Zostało jedno zadanie.<br>To jest najlepszy ruch TERAZ."
        : "To jest najlepszy ruch TERAZ.";
    decidedBox.classList.remove("hidden");
    return;
  }

  if (state.status === "DOING") {
    doingTask.innerText = state.currentTask;
    doingBox.classList.remove("hidden");
  }
}

async function decide() {
  if (!selectedTime) {
    alert("Wybierz czas na START.");
    return;
  }

  const state = await getState();
  if (state.chaos.length === 0) {
    const tasks = chaosInput.value.split("\n").map(t => t.trim()).filter(Boolean);
    if (!tasks.length) return;
    await fetch(API + "/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tasks })
    });
  }

  await fetch(API + "/decide", { method: "POST" });
  render();
}

async function startTask() {
  await fetch(API + "/start", { method: "POST" });
  render();
}

async function doneTask() {
  playTap();
  const el = document.getElementById("doingTask");
  el.classList.add("fade-up");

  setTimeout(async () => {
    await fetch(API + "/done", { method: "POST" });
    hasDoneAnything = true;
    selectedTime = null;
    el.classList.remove("fade-up");
    render();
  }, 450);
}

async function skipTask() {
  const state = await getState();
  if (state.chaos.length === 1) {
    sleep();
    return;
  }
  await fetch(API + "/later", { method: "POST" });
  selectedTime = null;
  lastAutoDecided = false;
  render();
}

async function reset() {
  await fetch(API + "/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tasks: [] })
  });
  chaosInput.value = "";
  hasDoneAnything = false;
  selectedTime = null;
  lastAutoDecided = false;
  render();
}

function sleep() {
  hideAll();
  sleepBox.classList.remove("hidden");
  setTimeout(() => {
    document.body.classList.add("fade-out");
  }, 5000);
}

render();
</script>

</body>
</html>
