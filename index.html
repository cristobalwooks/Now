<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta charset="UTF-8" />
  <title>NOW</title>

<style>
body {
  background: linear-gradient(180deg,#111827 0%,#0e1624 40%,#0b0b0b 100%);
  min-height: 100vh;
  color: #eaeaea;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
  transition: opacity 1.5s ease;
}
body.fade-out { opacity: 0; }

.hidden { display: none; }
.box { margin-top: 28px; padding: 24px; }

#intro {
  position: fixed;
  inset: 0;
  background: #0b0b0b;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#intro h1 {
  font-size: 42px;
  letter-spacing: 4px;
  opacity: 0;
  transform: scale(.96);
  transition: opacity 1.2s ease, transform 1.2s ease;
}

textarea {
  width: 100%;
  max-width: 320px;
  height: 120px;
  margin: 0 auto;
  display: block;
  background: #111;
  color: #f2f2f2;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 14px;
}

button {
  margin: 10px 8px;
  padding: 14px 20px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
}

.red { background:#e53935; color:#fff; }
.green { background:#2ecc71; color:#081a0f; }
.gray { background:#3a3a3a; color:#ddd; }
.rest { background:#1e3a5f; color:#e8f2ff; }

.fade-up {
  animation: fadeUp .75s ease-out forwards;
}
@keyframes fadeUp {
  from { opacity:1; transform:translateY(0); }
  to { opacity:0; transform:translateY(-24px); }
}

.zzz span {
  font-size: 18px;
  color: #4fc3f7;
  animation: wave 2.4s infinite ease-in-out;
}
@keyframes wave {
  0%{opacity:.4}50%{opacity:1}100%{opacity:.4}
}
.goodbye {
  margin-top: 20px;
  font-size: 13px;
  color: #777;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards;
  animation-delay: 2.5s;
}
@keyframes fadeIn { to{opacity:1} }
</style>
</head>

<body>

<div id="intro"><h1>NOW</h1></div>

<h1>NOW</h1>

<div id="idleBox" class="box hidden">
  <p>Jedna linia = jedno zadanie</p>
  <textarea id="chaosInput"></textarea>
  <button class="red" onclick="decide()">ZDECYDUJ ZA MNIE</button>
</div>

<div id="decidedBox" class="box hidden">
  <p id="decidedTask"></p>
  <button class="green" onclick="startTask()">ZACZĄŁEM</button>
</div>

<div id="doingBox" class="box hidden">
  <p id="doingTask"></p>
  <button class="green" onclick="doneTask()">ZROBIONE</button>
</div>

<div id="emptyBox" class="box hidden">
  <button class="rest" onclick="sleep()">Odpoczywam</button>
</div>

<div id="sleepBox" class="box hidden">
  <div class="zzz">
    <span>z</span><span>z</span><span>z</span><span>z</span>
  </div>
  <div class="goodbye">Wróć, gdy będziesz mnie potrzebować.</div>
</div>

<script>
/* INTRO */
(() => {
  const intro = document.getElementById("intro");
  const h1 = intro.querySelector("h1");
  requestAnimationFrame(() => {
    h1.style.opacity = 1;
    h1.style.transform = "scale(1)";
  });
  setTimeout(() => intro.remove(), 1400);
})();

/* AUDIO – STARA, DZIAŁAJĄCA METODA */
const doneSound = new Audio("/plum.mp3");
doneSound.volume = 0.4;

/* BACKEND */
const API = "https://now-production-9649.up.railway.app";

async function getState(){
  return (await fetch(API+"/state")).json();
}

function hideAll(){
  document.querySelectorAll(".box").forEach(b=>b.classList.add("hidden"));
}

async function render(){
  const state = await getState();
  hideAll();

  if(state.status==="IDLE"){
    idleBox.classList.remove("hidden");
  }
  if(state.status==="DECIDED"){
    decidedTask.innerText = state.currentTask;
    decidedBox.classList.remove("hidden");
  }
  if(state.status==="DOING"){
    doingTask.innerText = state.currentTask;
    doingBox.classList.remove("hidden");
  }
}

async function decide(){
  const tasks = chaosInput.value.split("\n").filter(Boolean);
  await fetch(API+"/tasks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tasks})});
  await fetch(API+"/decide",{method:"POST"});
  render();
}

async function startTask(){
  await fetch(API+"/start",{method:"POST"});
  render();
}

async function doneTask(){
  doneSound.currentTime = 0;
  doneSound.play();

  doingTask.classList.add("fade-up");
  setTimeout(async()=>{
    await fetch(API+"/done",{method:"POST"});
    doingTask.classList.remove("fade-up");
    render();
  },750);
}

function sleep(){
  hideAll();
  sleepBox.classList.remove("hidden");
  setTimeout(()=>document.body.classList.add("fade-out"),5000);
}

render();
</script>

</body>
</html>
