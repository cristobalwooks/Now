<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NOW">
  <meta name="theme-color" content="#0b0b0b">
  <meta charset="UTF-8" />
  <title>NOW</title>

<style>
body {
  background: #0b0b0b;
  color: #eaeaea;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif;
  text-align: center;
  padding: 40px;
  transition: opacity 1.5s ease;
}

body.fade-out { opacity: 0; }

/* ===== INSTRUCTION ===== */

.instruction {
  font-size: 14px;
  color: #ccc;
  margin-bottom: 6px;
}

/* ===== INPUT ===== */

textarea {
  width: 100%;
  max-width: 320px;
  height: 120px;
  margin: 0 auto;
  display: block;
  background: #111;
  color: #f2f2f2;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 14px;
  font-size: 15px;
}

/* ===== BUTTONS ===== */

button {
  margin: 10px 8px;
  padding: 14px 20px;
  font-size: 15px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.red {
  background: #e53935;
  color: white;
  box-shadow: 0 6px 14px rgba(229,57,53,0.35);
}
.red:active {
  transform: translateY(1px);
  box-shadow: 0 3px 8px rgba(229,57,53,0.35);
}

.green {
  background: #2ecc71;
  color: #081a0f;
  font-weight: 600;
  box-shadow: 0 6px 14px rgba(46,204,113,0.35);
}
.green:active {
  transform: translateY(1px);
  box-shadow: 0 3px 8px rgba(46,204,113,0.35);
}

.gray {
  background: #3a3a3a;
  color: #ddd;
}

/* ===== LAYOUT ===== */

.box {
  margin-top: 28px;
  padding: 24px;
}

.hidden { display: none; }

.time button { opacity: 0.4; }
.time button.active {
  opacity: 1;
  border: 2px solid #fff;
}

.final {
  font-size: 18px;
  line-height: 1.4;
}

/* ===== DONE ANIMATION ===== */

.fade-up {
  animation: fadeUp 0.45s ease-out forwards;
}
@keyframes fadeUp {
  from { opacity: 1; transform: translateY(0); filter: blur(0); }
  to   { opacity: 0; transform: translateY(-20px); filter: blur(4px); }
}

/* ===== SLEEP ===== */

.zzz {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 12px;
}

.zzz span {
  font-size: 18px;
  color: #4fc3f7;
  opacity: 0.8;
  animation: wave 2.4s infinite ease-in-out;
}

.zzz span:nth-child(1) { animation-delay: 0s; }
.zzz span:nth-child(2) { animation-delay: .2s; }
.zzz span:nth-child(3) { animation-delay: .4s; }
.zzz span:nth-child(4) { animation-delay: .6s; }
.zzz span:nth-child(5) { animation-delay: .8s; }
.zzz span:nth-child(6) { animation-delay: 1s; }

@keyframes wave {
  0%   { transform: translateY(0); opacity: .4; }
  50%  { transform: translateY(-6px); opacity: 1; }
  100% { transform: translateY(0); opacity: .4; }
}

.goodbye {
  margin-top: 28px;
  font-size: 13px;
  color: #777;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards;
  animation-delay: 2.5s;
}
@keyframes fadeIn { to { opacity: 1; } }

.done-mark {
  font-size: 20px;
  margin-left: 6px;
}
</style>
</head>

<body>

<div id="header">
  <h1>NOW</h1>
</div>

<!-- IDLE -->
<div id="idleBox" class="box hidden">
  <div class="instruction">Jedna linia = jedno zadanie</div>
  <textarea id="chaosInput" placeholder="Wpisz chaos..."></textarea>

  <div class="time">
    <p>Ile masz czasu na START?</p>
    <button id="t5" onclick="setTime('5')">5 min</button>
    <button id="t15" onclick="setTime('15')">15 min</button>
    <button id="t30" onclick="setTime('30')">30+ min</button>
  </div>

  <button class="red" onclick="decide()">ZDECYDUJ ZA MNIE</button>
</div>

<!-- DECIDED -->
<div id="decidedBox" class="box hidden">
  <p id="decideText" class="final"></p>
  <p id="decidedTask"></p>
  <button class="green" onclick="startTask()">ZACZĄŁEM</button>
  <button class="gray" onclick="skipTask()">NIE TERAZ</button>
</div>

<!-- DOING -->
<div id="doingBox" class="box hidden">
  <h2>ROBISZ</h2>
  <p id="doingTask"></p>
  <button class="green" onclick="doneTask()">
    ZROBIONE <span class="done-mark">👍</span>
  </button>
</div>

<!-- EMPTY -->
<div id="emptyBox" class="box hidden">
  <p>Chaos zniknął. Dobra robota.</p>
  <button class="gray" onclick="sleep()">Odpoczywam</button>
  <button class="red" onclick="reset()">Nowy chaos</button>
</div>

<!-- SLEEP -->
<div id="sleepBox" class="box hidden">
  <div class="zzz">
    <span>z</span><span>z</span><span>z</span><span>z</span><span>z</span><span>z</span>
  </div>
  <div class="goodbye">Wróć, gdy będziesz mnie potrzebować.</div>
</div>

<script>
/* LOGIKA BEZ ZMIAN – zostaje jak była */
</script>

</body>
</html>
