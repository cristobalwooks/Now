<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NOW">
  <meta name="theme-color" content="#0b0b0b">
  <meta charset="UTF-8" />
  <title>NOW</title>

<style>
body {
  background: linear-gradient(
    180deg,
    #111827 0%,
    #0e1624 40%,
    #0b0b0b 100%
  );
  min-height: 100vh;
  color: #eaeaea;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif;
  text-align: center;
  padding: 40px;
  transition: opacity 1.5s ease;
}
body.fade-out { opacity: 0; }

/* ===== INTRO ===== */
#intro {
  position: fixed;
  inset: 0;
  background: #0b0b0b;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#intro h1 {
  font-size: 42px;
  letter-spacing: 4px;
  opacity: 0;
  transform: scale(0.96);
  animation: introIn 1.2s ease forwards;
}
@keyframes introIn {
  to {
    opacity: 1;
    transform: scale(1);
  }
}
#intro.hide {
  opacity: 0;
  transition: opacity .4s ease;
  pointer-events: none;
}

/* ===== UI ===== */
.instruction {
  font-size: 14px;
  color: #ccc;
  margin-bottom: 6px;
}

textarea {
  width: 100%;
  max-width: 320px;
  height: 120px;
  margin: 0 auto;
  display: block;
  background: #111;
  color: #f2f2f2;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 14px;
  font-size: 15px;
}

button {
  margin: 10px 8px;
  padding: 14px 20px;
  font-size: 15px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: transform .08s ease, box-shadow .08s ease;
}

.red {
  background: #e53935;
  color: #fff;
  box-shadow: 0 6px 14px rgba(229,57,53,.35);
}
.green {
  background: #2ecc71;
  color: #081a0f;
  font-weight: 600;
  box-shadow: 0 6px 14px rgba(46,204,113,.35);
}
.gray {
  background: #3a3a3a;
  color: #ddd;
}
.rest {
  background: #1e3a5f;
  color: #e8f2ff;
  box-shadow: 0 8px 18px rgba(30,58,95,.45);
}

.box { margin-top: 28px; padding: 24px; }
.hidden { display: none; }

.time button { opacity: .4; }
.time button.active {
  opacity: 1;
  border: 2px solid #fff;
}

.final { font-size: 18px; line-height: 1.4; }

/* ===== ZROBIONE – SPOKOJNE DOMKNIĘCIE ===== */
.fade-up {
  animation: fadeUp .75s ease-out forwards;
}
@keyframes fadeUp {
  from { opacity: 1; transform: translateY(0); filter: blur(0); }
  to   { opacity: 0; transform: translateY(-24px); filter: blur(4px); }
}

/* ===== SLEEP ===== */
.zzz {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 12px;
}
.zzz span {
  font-size: 18px;
  color: #4fc3f7;
  opacity: .8;
  animation: wave 2.4s infinite ease-in-out;
}
.zzz span:nth-child(n){animation-delay: calc(var(--i)*.2s);}
@keyframes wave {
  0%{transform:translateY(0);opacity:.4;}
  50%{transform:translateY(-6px);opacity:1;}
  100%{transform:translateY(0);opacity:.4;}
}
.goodbye {
  margin-top: 28px;
  font-size: 13px;
  color: #777;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards;
  animation-delay: 2.5s;
}
@keyframes fadeIn { to { opacity: 1; } }

.done-mark { font-size: 20px; margin-left: 6px; }
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro" class="hidden">
  <h1>NOW</h1>
</div>

<div id="header"><h1>NOW</h1></div>

<!-- IDLE -->
<div id="idleBox" class="box hidden">
  <div class="instruction">Jedna linia = jedno zadanie</div>
  <textarea id="chaosInput" placeholder="Wpisz chaos..."></textarea>

  <div class="time">
    <p>Ile masz czasu na START?</p>
    <button id="t5" onclick="setTime('5')">5 min</button>
    <button id="t15" onclick="setTime('15')">15 min</button>
    <button id="t30" onclick="setTime('30')">30+ min</button>
  </div>

  <button class="red" onclick="decide()">ZDECYDUJ ZA MNIE</button>
</div>

<!-- DECIDED -->
<div id="decidedBox" class="box hidden">
  <p id="decideText" class="final"></p>
  <p id="decidedTask"></p>
  <button class="green" onclick="startTask()">ZACZĄŁEM</button>
  <button class="gray" onclick="skipTask()">NIE TERAZ</button>
</div>

<!-- DOING -->
<div id="doingBox" class="box hidden">
  <h2>ROBISZ</h2>
  <p id="doingTask"></p>
  <button class="green" onclick="doneTask()">ZROBIONE <span class="done-mark">👍</span></button>
</div>

<!-- EMPTY -->
<div id="emptyBox" class="box hidden">
  <p>Chaos zniknął. Dobra robota.</p>
  <button class="rest" onclick="sleep()">Odpoczywam</button>
  <button class="red" onclick="reset()">Nowy chaos</button>
</div>

<!-- SLEEP -->
<div id="sleepBox" class="box hidden">
  <div class="zzz">
    <span style="--i:0">z</span><span style="--i:1">z</span><span style="--i:2">z</span>
    <span style="--i:3">z</span><span style="--i:4">z</span><span style="--i:5">z</span>
  </div>
  <div class="goodbye">Wróć, gdy będziesz mnie potrzebować.</div>
</div>

<script>
const API = "https://now-production-9649.up.railway.app";

let selectedTime=null, hasDoneAnything=false, lastAutoDecided=false;

/* ===== INTRO LOGIC ===== */
(function(){
  const today = new Date().toDateString();
  const last = localStorage.getItem("now_intro_day");
  if (last !== today) {
    const intro = document.getElementById("intro");
    intro.classList.remove("hidden");
    setTimeout(()=>intro.classList.add("hide"),1200);
    setTimeout(()=>intro.remove(),1600);
    localStorage.setItem("now_intro_day", today);
  }
})();

/* ===== CORE ===== */
function hideAll(){document.querySelectorAll(".box").forEach(b=>b.classList.add("hidden"));}
async function getState(){return (await fetch(API+"/state")).json();}

function setTime(t){
  selectedTime=t;
  ["t5","t15","t30"].forEach(id=>document.getElementById(id).classList.remove("active"));
  document.getElementById("t"+t).classList.add("active");
}

async function render(){
  const state=await getState(); hideAll();

  if(state.status==="IDLE" && state.chaos.length===1 && !lastAutoDecided){
    lastAutoDecided=true;
    await fetch(API+"/decide",{method:"POST"});
    return render();
  }

  if(state.status==="IDLE"){
    lastAutoDecided=false;
    if(state.chaos.length===0){
      (hasDoneAnything?emptyBox:idleBox).classList.remove("hidden");
      return;
    }
    chaosInput.value=state.chaos.join("\n");
    idleBox.classList.remove("hidden");
  }

  if(state.status==="DECIDED"){
    decidedTask.innerText=state.currentTask;
    decideText.innerHTML=state.chaos.length===1
      ?"Zostało jedno zadanie.<br>To jest najlepszy ruch TERAZ."
      :"To jest najlepszy ruch TERAZ.";
    decidedBox.classList.remove("hidden");
  }

  if(state.status==="DOING"){
    doingTask.innerText=state.currentTask;
    doingBox.classList.remove("hidden");
  }
}

async function decide(){
  if(!selectedTime) return alert("Wybierz czas na START.");
  const state=await getState();
  if(state.chaos.length===0){
    const tasks=chaosInput.value.split("\n").map(t=>t.trim()).filter(Boolean);
    if(!tasks.length) return;
    await fetch(API+"/tasks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tasks})});
  }
  await fetch(API+"/decide",{method:"POST"}); render();
}

async function startTask(){await fetch(API+"/start",{method:"POST"}); render();}

async function doneTask(){
  doingTask.classList.add("fade-up");
  setTimeout(async()=>{
    await fetch(API+"/done",{method:"POST"});
    hasDoneAnything=true; selectedTime=null;
    doingTask.classList.remove("fade-up");
    render();
  },750);
}

async function skipTask(){
  const state=await getState();
  if(state.chaos.length===1) return sleep();
  await fetch(API+"/later",{method:"POST"});
  selectedTime=null; lastAutoDecided=false; render();
}

async function reset(){
  await fetch(API+"/tasks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tasks:[]})});
  chaosInput.value=""; hasDoneAnything=false; selectedTime=null; lastAutoDecided=false;
  render();
}

function sleep(){
  hideAll(); sleepBox.classList.remove("hidden");
  setTimeout(()=>document.body.classList.add("fade-out"),5000);
}

render();
</script>

</body>
</html>
