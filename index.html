<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>NOW</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NOW">
  <meta name="theme-color" content="#0b0b0b">

<style>
body {
  background: #0b0b0b;
  color: #f2f2f2;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
  transition: opacity 1.5s ease;
}

body.fade-out { opacity: 0; }

/* ===== INTRO ===== */
#introScreen {
  position: fixed;
  inset: 0;
  background: #0b0b0b;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#introLogo {
  font-size: 64px;
  letter-spacing: 14px;
  font-weight: bold;
  animation: introAnim 1.4s ease forwards;
}

@keyframes introAnim {
  0% { opacity: 0; letter-spacing: 40px; }
  40% { opacity: 1; letter-spacing: 14px; }
  70% { opacity: 1; letter-spacing: 14px; }
  100% { opacity: 0; letter-spacing: 0; transform: scale(0.6); }
}

.hidden { display: none; }

/* ===== UI ===== */
textarea {
  width: 100%;
  max-width: 320px;
  height: 120px;
  box-sizing: border-box;
  margin: 0 auto;
  display: block;
}

button {
  margin: 8px;
  padding: 12px 18px;
  font-size: 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.red { background: #e53935; color: white; }
.green { background: #2ecc71; color: black; }
.gray { background: #444; color: white; }

.box {
  margin-top: 20px;
  padding: 20px;
  border: 1px solid #333;
}

.time button { opacity: 0.4; }
.time button.active {
  opacity: 1;
  border: 2px solid white;
}

.final {
  font-size: 18px;
  line-height: 1.4;
}

/* ✨ DONE */
.fade-up {
  animation: fadeUp 0.45s ease-out forwards;
}
@keyframes fadeUp {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-20px); filter: blur(4px); }
}

/* 🌙 SLEEP */
.zzz {
  font-size: 16px;
  color: #4fc3f7;
  letter-spacing: 6px;
  animation: float 2s infinite ease-in-out;
}
@keyframes float {
  0% { transform: translateY(0); opacity: .6; }
  50% { transform: translateY(-10px); opacity: 1; }
  100% { transform: translateY(0); opacity: .6; }
}

.goodbye {
  margin-top: 30px;
  font-size: 13px;
  color: #777;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards;
  animation-delay: 3s;
}
@keyframes fadeIn { to { opacity: 1; } }
</style>
</head>

<body>

<!-- INTRO -->
<div id="introScreen" class="hidden">
  <div id="introLogo">NOW</div>
</div>

<div id="header">
  <h1>NOW</h1>
  <p id="subtitle">Jedna linia = jedno zadanie</p>
</div>

<div id="idleBox" class="box hidden">
  <textarea id="chaosInput" placeholder="Wpisz chaos..."></textarea>
  <div class="time">
    <p>Ile masz czasu na START?</p>
    <button id="t5" onclick="setTime('5')">5 min</button>
    <button id="t15" onclick="setTime('15')">15 min</button>
    <button id="t30" onclick="setTime('30')">30+ min</button>
  </div>
  <button class="red" onclick="decide()">ZDECYDUJ ZA MNIE</button>
</div>

<div id="decidedBox" class="box hidden">
  <p id="decideText" class="final"></p>
  <p id="decidedTask"></p>
  <button class="green" onclick="startTask()">ZACZĄŁEM</button>
  <button class="gray" onclick="skipTask()">NIE TERAZ</button>
</div>

<div id="doingBox" class="box hidden">
  <h2>ROBISZ</h2>
  <p id="doingTask"></p>
  <button class="green" onclick="doneTask()">ZROBIONE</button>
</div>

<div id="emptyBox" class="box hidden">
  <p>Chaos zniknął. Dobra robota.</p>
  <button class="gray" onclick="sleep()">Odpoczywam</button>
  <button class="red" onclick="reset()">Nowy chaos</button>
</div>

<div id="sleepBox" class="box hidden">
  <div class="zzz">z z z z z z</div>
  <div class="goodbye">Wróć, gdy będziesz mnie potrzebować.</div>
</div>

<script>
const API = "https://now-production-9649.up.railway.app";

/* ===== INTRO (NON-BLOCKING) ===== */
const todayKey = new Date().toISOString().slice(0, 10);
const lastIntroDay = localStorage.getItem("introSeen");
const intro = document.getElementById("introScreen");

if (lastIntroDay !== todayKey) {
  intro.classList.remove("hidden");
  setTimeout(() => {
    intro.classList.add("hidden");
    localStorage.setItem("introSeen", todayKey);
  }, 1400);
}

/* ===== APP STATE ===== */
let selectedTime = null;
let hasDoneAnything = false;
let lastAutoDecided = false;

/* ===== UTILS ===== */
function hideAll() {
  document.querySelectorAll(".box").forEach(b => b.classList.add("hidden"));
}

/* ===== STATE ===== */
async function getState() {
  const res = await fetch(API + "/state");
  return res.json();
}

/* ===== UI ===== */
function setTime(t) {
  selectedTime = t;
  ["t5","t15","t30"].forEach(id =>
    document.getElementById(id).classList.remove("active")
  );
  document.getElementById("t"+t).classList.add("active");
}

async function render() {
  const state = await getState();
  hideAll();
  header.classList.remove("hidden");
  subtitle.classList.remove("hidden");

  if (state.status === "IDLE" && state.chaos.length === 1 && !lastAutoDecided) {
    lastAutoDecided = true;
    await fetch(API + "/decide", { method: "POST" });
    return render();
  }

  if (state.status === "IDLE") {
    lastAutoDecided = false;
    if (state.chaos.length === 0) {
      (hasDoneAnything ? emptyBox : idleBox).classList.remove("hidden");
      return;
    }
    chaosInput.value = state.chaos.join("\n");
    idleBox.classList.remove("hidden");
    return;
  }

  if (state.status === "DECIDED") {
    decidedTask.innerText = state.currentTask;
    decideText.innerHTML =
      state.chaos.length === 1
        ? "Zostało jedno zadanie.<br>To jest najlepszy ruch TERAZ."
        : "To jest najlepszy ruch TERAZ.";
    decidedBox.classList.remove("hidden");
    return;
  }

  if (state.status === "DOING") {
    doingTask.innerText = state.currentTask;
    doingBox.classList.remove("hidden");
  }
}

/* ===== ACTIONS ===== */
async function decide() {
  if (!selectedTime) return alert("Wybierz czas na START.");
  const state = await getState();
  if (state.chaos.length === 0) {
    const tasks = chaosInput.value.split("\n").map(t => t.trim()).filter(Boolean);
    if (!tasks.length) return;
    await fetch(API + "/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tasks })
    });
  }
  await fetch(API + "/decide", { method: "POST" });
  render();
}

async function startTask() {
  await fetch(API + "/start", { method: "POST" });
  render();
}

async function doneTask() {
  doingTask.classList.add("fade-up");
  setTimeout(async () => {
    await fetch(API + "/done", { method: "POST" });
    hasDoneAnything = true;
    selectedTime = null;
    doingTask.classList.remove("fade-up");
    render();
  }, 450);
}

async function skipTask() {
  const state = await getState();
  if (state.chaos.length === 1) return sleep();
  await fetch(API + "/later", { method: "POST" });
  selectedTime = null;
  lastAutoDecided = false;
  render();
}

async function reset() {
  await fetch(API + "/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tasks: [] })
  });
  chaosInput.value = "";
  hasDoneAnything = false;
  selectedTime = null;
  lastAutoDecided = false;
  render();
}

function sleep() {
  hideAll();
  subtitle.classList.add("hidden");
  sleepBox.classList.remove("hidden");
  setTimeout(() => document.body.classList.add("fade-out"), 5500);
}

/* ===== START ===== */
render();
</script>

</body>
</html>
